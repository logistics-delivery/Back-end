spring:
  application:
    name: slack-service
  datasource:
    url: jdbc:postgresql://localhost:5001/maindb
    username: admin
    password: 1234
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: slack_service
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: false  # H2 콘솔 비활성화 (PostgreSQL 사용 시)
  ai:
    openai:
      api-key: ${OPEN_AI_KEY}
server:
  port: 8087

eureka:
  client:
    register-with-eureka: true # Eureka? ??? ??
    fetch-registry: true # Eureka?? ??? ?? ????
    service-url:
     defaultZone: http://localhost:8761/eureka/

springdoc:
  api-docs:
    version: openapi_3_1
    enabled: true
    path: /slack-service/v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
slack:
  webhook:
    url: ${SLACK_URL}
  