spring:
  application:
    name: company-service
  datasource:
    url: jdbc:postgresql://localhost:5432/company-service
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
    jpa:
      hibernate:
        ddl-auto: update
      open-in-view: false
      show-sql: true
      properties:
        hibernate:
          format_sql: true
          default_batch_fetch_size: 10

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

server:
  port: 8085

springdoc:
  api-docs:
    version: openapi_3_1
    enabled: true
    path: /company-service/v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
